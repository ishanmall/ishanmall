
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset=".55" stop-color="#11112A"/>
      <stop offset="1" stop-color="#071B2C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A6"/>
      <stop offset=".45" stop-color="#FFB52E"/>
      <stop offset="1" stop-color="#C76A13"/>
    </linearGradient>
    <linearGradient id="heading" x1="90" y1="100" x2="650" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#FFE7AE"/>
      <stop offset="1" stop-color="#D9A34C"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FFB52E" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#FFE4A1" opacity=".55"/>
      <circle cx="64" cy="54" r="1.2" fill="#B8DFFF" opacity=".4"/>
      <circle cx="40" cy="82" r=".8" fill="#FFFFFF" opacity=".5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#stars)"/>
  <ellipse cx="950" cy="180" rx="260" ry="190" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Cosmic decorative lines -->
  <path d="M750 0L1100 380M850 0L1200 350" stroke="#D7A34B" stroke-opacity=".12"/>
  <path d="M0 340C260 300 430 390 700 330" stroke="url(#gold)" stroke-opacity=".3"/>

  <!-- Mantras -->
  <g font-family="Noto Serif Devanagari, Mangal, serif" font-size="18" font-weight="bold" fill="url(#gold)" text-anchor="middle">
    <text x="330" y="75">॥ ॐ नमः शिवाय ॥</text>
    <text x="600" y="75">॥ जय माता दी ॥</text>
    <text x="870" y="75">॥ जय श्री राम ॥</text>
  </g>

  <g stroke="#DCA64F" stroke-width="1" opacity=".55">
    <path d="M100 70H180"/>
    <path d="M1020 70H1100"/>
  </g>

  <!-- Name -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="82" y="165" fill="url(#heading)" font-size="68" font-weight="800" letter-spacing="-3">ISHAN MALL</text>
    <path d="M85 185C230 205 410 200 590 180" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="82" y="231" fill="#E0E8FF" font-size="21" font-weight="500">Android Developer  /  Software Engineer</text>
    <text x="82" y="267" fill="#C5B28F" font-size="15">Turning imagination into meaningful digital experiences.</text>
  </g>

  <!-- Mantra panel -->
  <g transform="translate(82 298)">
    <rect width="500" height="42" rx="12" fill="#251A14" fill-opacity=".65" stroke="#D79B3B" stroke-opacity=".55"/>
    <path d="M166 9V33M333 9V33" stroke="#D79B3B" stroke-opacity=".45"/>
    <g font-family="Noto Serif Devanagari, Mangal, serif" font-size="16" font-weight="bold" fill="#FFD68A" text-anchor="middle">
      <text x="83" y="27">ॐ नमः शिवाय</text>
      <text x="250" y="27">जय माता दी</text>
      <text x="416" y="27">जय श्री राम</text>
    </g>
  </g>

  <!-- Sacred Om mandala -->
  <g transform="translate(925 174)">
    <circle r="132" fill="#FFB52E" fill-opacity=".035"/>
    <circle r="119" stroke="url(#gold)" stroke-width="1.5" opacity=".65"/>
    <circle r="108" stroke="#E7B75D" stroke-dasharray="3 7" opacity=".65"/>
    <circle r="94" stroke="url(#gold)" stroke-width="2" opacity=".65"/>

    <!-- Mandala petals -->
    <g stroke="url(#gold)" stroke-width="1.5" opacity=".8">
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(30)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(60)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(90)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(120)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(150)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(180)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(210)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(240)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(270)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(300)"/>
      <path d="M0 -119Q22 -90 0 -68Q-22 -90 0 -119Z" transform="rotate(330)"/>
    </g>

    <circle r="75" fill="#17162A" stroke="url(#gold)" stroke-width="2"/>
    <circle r="65" stroke="#FFD27A" stroke-opacity=".5" stroke-dasharray="2 5"/>

    <!-- Om symbol -->
    <text x="0" y="25" text-anchor="middle" font-family="Noto Sans Devanagari, Mangal, serif" font-size="76" font-weight="bold" fill="url(#gold)">ॐ</text>

    <!-- Sacred rays -->
    <g stroke="#FFCB69" stroke-width="2" stroke-linecap="round">
      <path d="M0 -144V-132M0 132V144M144 0H132M-132 0H-144"/>
      <path d="M102 -102L94 -94M-102 -102L-94 -94M102 102L94 94M-102 102L-94 94"/>
    </g>
  </g>

  <!-- Trishul ornament -->
  <g transform="translate(600 352)" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 17V-13"/>
    <path d="M0 -13C-5 -20 -9 -29 -7 -39C-1 -34 0 -27 0 -20"/>
    <path d="M0 -13C5 -20 9 -29 7 -39C1 -34 0 -27 0 -20"/>
    <path d="M0 -13C-13 -18 -18 -28 -17 -39C-7 -35 -3 -28 0 -18"/>
    <path d="M0 -13C13 -18 18 -28 17 -39C7 -35 3 -28 0 -18"/>
  </g>
  <path d="M430 339H565M635 339H770" stroke="url(#gold)" stroke-opacity=".7" stroke-width="1.5"/>

  <!-- Border -->
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="27.25" stroke="url(#gold)" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
