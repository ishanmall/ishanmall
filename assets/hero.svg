<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Rounded Clip -->
    <clipPath id="cardClip">
      <rect width="900" height="260" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & Grid -->
    <rect width="900" height="260" fill="url(#bg)" />
    <rect width="900" height="260" fill="url(#grid)" />

    <!-- Animated Orbs -->
    <circle cx="800" cy="40" r="160" fill="url(#orbPink)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="240" r="180" fill="url(#orbCyan)">
      <animate attributeName="opacity" values="1;0.45;1" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Card Border -->
    <rect x="0.5" y="0.5" width="899" height="259" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14" />

    <!-- Top Status Badge -->
    <rect x="48" y="34" width="286" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ec4899" stroke-opacity="0.45" />
    <circle cx="66" cy="48" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="52" fill="#f472b6" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">
      B.TECH CSE (AKTU) • GORAKHPUR, INDIA
    </text>

    <!-- Main Name -->
    <text x="48" y="120" fill="url(#nameGrad)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-1">
      ISHAN MALL
    </text>

    <!-- Subtitle -->
    <text x="48" y="152" fill="#cbd5e1" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      Android App Developer (Kotlin / Compose) • 3D WebGL Engineer • NASA & ISRO Certified
    </text>

    <!-- Stat Pills -->
    <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">
      <rect x="48" y="182" width="160" height="32" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="128" y="202" text-anchor="middle">5+ Play Store Apps</text>

      <rect x="220" y="182" width="170" height="32" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="305" y="202" text-anchor="middle">5+ 3D / Web Platforms</text>

      <rect x="402" y="182" width="160" height="32" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="482" y="202" text-anchor="middle">Chrome Extensions</text>

      <rect x="574" y="182" width="225" height="32" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="686" y="202" text-anchor="middle">30+ NASA / ISRO / Google Certs</text>
    </g>
  </g>
</svg>
